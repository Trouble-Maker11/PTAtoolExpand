<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTA比赛生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 500px;
            min-height: 400px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }

        .container {
            background: white;
            border-radius: 12px;
            margin: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 20px;
            color: #667eea;
            margin-bottom: 15px;
            text-align: center;
        }

        .status {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            text-align: center;
            background: #e3f2fd;
            color: #1976d2;
        }

        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
        }

        .status.warning {
            background: #fff3e0;
            color: #ef6c00;
        }

        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #666;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e0e0e0;
        }

        .search-container {
            margin: 10px 0;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 35px 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 13px;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-input::placeholder {
            color: #999;
        }

        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            pointer-events: none;
        }

        .clear-search {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            padding: 0;
            width: 20px;
            height: 20px;
            font-size: 16px;
            line-height: 1;
            display: none;
        }

        .clear-search:hover {
            color: #667eea;
        }

        .problem-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            margin: 10px 0;
        }

        .problem-item {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
        }

        .problem-item:hover {
            background: #f8f9fa;
        }

        .problem-item.selected {
            background: #e3f2fd;
            border-left: 4px solid #667eea;
        }

        .problem-item.hidden {
            display: none;
        }

        .problem-item:last-child {
            border-bottom: none;
        }

        .problem-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .problem-meta {
            font-size: 12px;
            color: #999;
        }

        .search-result-count {
            font-size: 12px;
            color: #666;
            margin: 5px 0;
            text-align: center;
        }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .config-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .config-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 10px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 PTA比赛生成器</h1>

        <div id="status" class="status">准备就绪</div>

        <div class="config-section">
            <div class="config-label">组织名称</div>
            <input type="text" id="organization" placeholder="例如: HBUE" value="HBUE">

            <div class="config-label">区域ID</div>
            <input type="text" id="regionId" placeholder="例如: 1" value="1">
        </div>

        <button id="refreshBtn" class="btn-primary">
            刷新题目集列表
        </button>

        <div id="searchContainer" class="search-container" style="display: none;">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索题目集名称或ID...">
            <button id="clearSearch" class="clear-search">×</button>
        </div>

        <div id="searchResultCount" class="search-result-count" style="display: none;"></div>

        <div id="problemList" class="problem-list" style="display: none;">
            <div class="empty-state">暂无数据</div>
        </div>

        <button id="generateBtn" class="btn-primary" style="display: none;" disabled>
            生成XML文件
        </button>

        <button id="openPintiaBtn" class="btn-secondary">
            打开PTA网站
        </button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
